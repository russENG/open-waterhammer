<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy (defense in depth)
      - default-src 'self': 同一オリジン以外からの読込を遮断
      - script-src 'self': 自己ホストしたスクリプトとローカル WASM のみ許可
      - style-src 'self' 'unsafe-inline': KaTeX が style 属性を生成するため inline 許可
      - img-src 'self' data: blob:: 生成画像と、利用者が明示的に有効化した OSM basemap tile を許可
      - connect-src: 同一オリジンと、明示的に有効化した OSM basemap のみ許可
      - frame-src: 農林水産省の公式PDFと、利用者が登録したローカルPDFのみ許可
      - object-src 'none': プラグイン/embed を禁止
      - base-uri 'self': base タグ注入を禁止
      - form-action 'self': フォーム送信先を同一オリジンに限定
      クリックジャッキング防止は meta CSP では効かないため、main.tsx の埋め込み拒否と
      ヘッダー対応ホスト用 public/_headers で実施する。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org; frame-src 'self' blob: https://www.maff.go.jp; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <title>Open Waterhammer — 農業用パイプライン水撃圧計算</title>
    <meta name="description" content="土地改良事業計画設計基準 設計「パイプライン」（令和3年改定）を参照する水撃圧計算オープンソースツール。定常流・特性曲線法・成果品様式帳票出力に対応。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
