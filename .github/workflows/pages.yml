name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies (Marimo)
        run: pip install marimo uv

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build --workspace=packages/contracts
          npm run build --workspace=packages/workspace
          npm run build --workspace=packages/core
          npm run build --workspace=packages/excel-io
          npm run build --workspace=packages/sample-data
          npm run build --workspace=packages/epanet-adapter
          npm run build --workspace=packages/runner

      - name: Build Marimo notebooks
        run: node scripts/build-notebooks.mjs

      - name: Build web-free
        run: npm run build --workspace=apps/web-free
        env:
          VITE_BASE_PATH: /open-waterhammer/
          # Public-site-only, cookie-less page-view counting. Unset (e.g. offline builds and
          # forks) => the beacon and its CSP allowance are both omitted.
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-free/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
