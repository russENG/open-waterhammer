name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces (incl. cli)
        run: npm test

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint all workspaces (incl. UI wording)
        run: npm run lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Test core-py (warning-free)
        run: python -m pytest packages/core-py/tests -q -W error::DeprecationWarning -W error::pytest.PytestDeprecationWarning

      - name: Golden .owhproj acceptance
        run: npm run acceptance
        env:
          OWH_GIT_SHA: ${{ github.sha }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (self-builds and serves web-free)
        run: npm run test:e2e -w apps/web-free

      - name: Verify a clean worktree
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
